[project]
name = "offline-ai-stack"
version = "0.1.0"
description = "A production-grade offline AI and RAG environment"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Offline AI Stack Team", email = "info@offline-ai-stack.local" }
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "docker>=7.0.0",
    "qdrant-client>=1.8.0",
    "llama-index-core>=0.10.0",
    "llama-index-vector-stores-qdrant>=0.1.0",
    "llama-index-embeddings-ollama>=0.1.0",
    "llama-index-llms-ollama>=0.1.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "psutil>=5.9.8",
    "pypdf>=4.1.0",
    "faster-whisper>=1.0.0",
    "static-ffmpeg>=2.5.0",
    "python-multipart>=0.0.5",
]

[project.scripts]
offline-ai = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
